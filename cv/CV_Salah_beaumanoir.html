<style>
#cv-editor-panel{position:fixed;right:12px;top:12px;z-index:999;background:#fff;border:1px solid #aab9cd;box-shadow:0 4px 22px #0002;border-radius:9px;padding:12px;max-width:205px;font:12px Arial,sans-serif;color:#20334e}
#cv-editor-panel button{background:#1956a5;color:#fff;border:0;border-radius:5px;padding:8px;cursor:pointer;margin:4px 2px}
#cv-editor-panel .hint{line-height:1.4;margin:4px}
@media print{#cv-editor-panel{display:none!important}}
</style>
<div id="cv-editor-panel" hidden>
  <strong>Modifier ce CV</strong>
  <p class="hint">Cliquez sur un texte pour le corriger. La maquette originale reste fixe.</p>
  <button id="cv-save-html">Enregistrer HTML</button>
  <button id="cv-print-pdf">Imprimer PDF</button>
</div>
<script>
(function(){
  if(new URLSearchParams(location.search).get('edit')!=='1')return;
  const panel=document.getElementById('cv-editor-panel');
  panel.hidden=false;
  document.querySelectorAll('svg text').forEach(el=>{
    el.style.cursor='text';
    el.addEventListener('click',()=>{
      const before=el.textContent;
      const after=window.prompt('Modifier le texte :',before);
      if(after===null||after===before)return;
      const oldWidth=parseFloat(el.getAttribute('textlength')||el.getAttribute('textLength')||'0');
      const x=parseFloat(el.getAttribute('x')||'0');
      const maxWidth=(x<190?174:575)-x;
      if(oldWidth>0){
        const estimated=Math.max(4,oldWidth*after.length/Math.max(1,before.length));
        el.setAttribute('textLength',Math.min(maxWidth,estimated).toFixed(2));
      }
      el.textContent=after;
    });
  });
  document.getElementById('cv-save-html').onclick=()=>{
    const content='<!doctype html>\n'+document.documentElement.outerHTML;
    const blob=new Blob([content],{type:'text/html;charset=utf-8'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=location.pathname.split('/').pop();a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  };
  document.getElementById('cv-print-pdf').onclick=()=>window.print();
})();
</script>
