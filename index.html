<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alternance Salah</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#20342b;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1510px;margin:auto;padding:30px 24px 55px}.heading{display:flex;align-items:center;gap:13px;margin-bottom:22px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#225441;color:white;font-size:23px;font-weight:750}h1{font-size:28px;letter-spacing:-.9px;margin:0}.panel{background:white;border:1px solid #e0e8df;border-radius:16px;box-shadow:0 12px 36px #112b1c0a;overflow:hidden}.tabs{display:flex;align-items:center;gap:6px;padding:11px 13px;border-bottom:1px solid #e6ece5}.tab{appearance:none;border:0;background:transparent;color:#607669;font:650 15px inherit;font-family:inherit;font-size:15px;font-weight:650;border-radius:10px;padding:12px 18px;cursor:pointer}.tab.active{color:#204a38;background:#e7f1e9}.count{display:inline-grid;place-items:center;min-width:23px;padding:2px 5px;background:#ffffffa8;border-radius:8px;margin-left:5px;font-size:12px}.scroll{overflow:auto;max-height:calc(100vh - 180px);min-height:270px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.43}th{position:sticky;top:0;background:#f5f8f4;color:#617568;z-index:1;font-weight:700;text-align:left;font-size:12px;padding:13px 12px;border-bottom:1px solid #e6ece5}td{padding:13px 12px;vertical-align:top;border-bottom:1px solid #edf1ec}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfa}th:nth-child(1){width:6%}th:nth-child(2){width:27%}th:nth-child(3){width:11%}th:nth-child(4){width:15%}th:nth-child(5){width:22%}th:nth-child(6){width:19%}.rank{font-weight:800;color:#3b6650}.company{font-weight:750;color:#1d392a;font-size:14px}.role{font-weight:600;margin:2px 0 6px}.date{font-variant-numeric:tabular-nums;color:#4c6356}.fit{font-weight:700;color:#346849}.fit.medium{color:#916f3d}.urlrow{display:flex;gap:5px;align-items:center}.url{min-width:0;max-width:100%;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#f0f4f0;padding:6px 7px;border-radius:7px;color:#345b43}.copy,.go{flex:none;background:#e5f0e7;border:0;border-radius:7px;color:#28553c;font-size:12px;padding:6px 8px;cursor:pointer;text-decoration:none;font-weight:700}.copy:hover,.go:hover{background:#d2e6d8}.empty{padding:30px;text-align:center}@media(max-width:950px){.wrap{padding:20px 12px}.scroll{max-height:none}table{min-width:1030px}.tabs{padding:8px}.tab{padding:11px 12px;font-size:14px}}
</style></head><body><main class="wrap"><header class="heading"><div class="logo">S</div><h1>Alternance Salah</h1></header><section class="panel"><nav class="tabs" aria-label="Offres"><button class="tab active" id="tc" onclick="show('current')">À découvrir <span class="count" id="nc"></span></button><button class="tab" id="ts" onclick="show('sent')">Transmises via Constanza <span class="count" id="ns"></span></button></nav><div class="scroll"><table><thead><tr><th>Priorité</th><th>Entreprise et offre · Web</th><th>Adéquation</th><th>Pourquoi cette position</th><th>Réserve principale</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const DATA={"current": [{"company": "Bouygues Construction", "role": "Analyste Power BI", "url": "https://www.jobteaser.com/fr/job-offers/1a57e714-a79b-4645-b849-0c34bc8cde6b-bouygues-construction-alternance-analyste-power-bi-f-h", "fit": "Forte", "date": "01/11/2026 07:57", "why": "Deux projets Power BI, tableaux de bord et suivi KPI.", "risk": "Niveau DAX et disponibilité actuelle à vérifier.", "rank": 1}, {"company": "ETLB / Côté Sushi", "role": "Assistant(e) IA / BI", "url": "https://monemploienidf.francetravail.fr/je-trouve-un-emploi/offres-emploi/214YWWX", "fit": "Forte", "date": "30/10/2026 21:59", "why": "Python/API, automatisation et visualisation de données.", "risk": "Date de démarrage ancienne ; ouverture non confirmée.", "rank": 2}, {"company": "WSN Events", "role": "Marketing opérationnel & data visiteurs", "url": "https://wsn-events.com/assistant-chef-de-projet-marketing-operationnel-alternance", "fit": "Forte", "date": "31/10/2026 07:19", "why": "Expérience événementielle Comexposium et marketing/CRM chez Aplus.", "risk": "Possible obligation de contrat de 24 mois.", "rank": 3}, {"company": "Maison&Objet", "role": "Data Analyst", "url": "https://www.welcometothejungle.com/fr/companies/maison-objet/jobs/2974a565-161c-4861-8134-5fdd5e6e4c3c", "fit": "Forte", "date": "31/10/2026 07:19", "why": "Analyse de données et expérience du secteur salons/visiteurs.", "risk": "Ancienneté de l’annonce ; ouverture à confirmer.", "rank": 4}, {"company": "ACT-ON GROUP", "role": "SalesOps", "url": "https://actongroup.com/offre/alternante-salesops-neuilly-sur-seine-2/", "fit": "Incertaine", "date": "31/10/2026 07:19", "why": "Entonnoir commercial, reporting et automatisation.", "risk": "Contradiction stage / alternance dans l’historique.", "rank": 5}, {"company": "RMC BFM / CMA CGM", "role": "Projets Growth Marketing", "url": "https://jobs.cmacgm-group.com/job/ALTERNANCE-Charg%C3%A9%28e%29-de-projets-growth-marketing-%28FHX%29%29/589564-fr_FR/", "fit": "Incertaine", "date": "31/10/2026 10:06", "why": "Campagnes marketing et analyse de performance.", "risk": "Poids réel de la data et conditions du contrat à confirmer.", "rank": 6}, {"company": "HeyTeam", "role": "Marketing & Growth Coordinator", "url": "https://join.com/companies/heyteam/16881809-alternance-marketing-et-growth-coordinator", "fit": "Modérée", "date": "31/10/2026 18:49", "why": "Marketing et KPI, mais correspondance moins directe.", "risk": "HubSpot, Ads et compétences growth spécifiques à vérifier.", "rank": 7}], "sent": [{"company": "Groupe Beaumanoir / La Halle", "role": "Assistant(e) Data", "url": "https://groupe-beaumanoir.gestmax.fr/17199/1/alternance-assistant-e-data-h-f", "fit": "Forte", "date": "31/10/2026 07:19", "why": "Python, SQL, reporting et expérience Comexposium : profil directement défendable.", "risk": "Offre et calendrier à revérifier.", "rank": 1}, {"company": "muchbetter.ai", "role": "Sales Ops, outils & IA", "url": "https://www.welcometothejungle.com/fr/companies/muchbetter-ai/jobs/alternance-sales-ops-outils-ia_paris", "fit": "Excellente", "date": "—", "why": "Automatisation, outils métier et analyse commerciale, cohérents avec son portfolio.", "risk": "Démarrage janvier 2027 ; vérifier Efrei et conditions.", "rank": 2}, {"company": "MG Motor France", "role": "Business Intelligence, Reporting & Analysis", "url": "https://www.linkedin.com/jobs/view/business-intelligence-reporting-analysis-apprenticeship-internship-at-mg-motor-france-4480663639/", "fit": "Excellente", "date": "—", "why": "Power BI, tableaux de bord et KPI : preuves directement mobilisables.", "risk": "Anglais fluide et niveau exigé à confirmer.", "rank": 3}, {"company": "Solocal", "role": "Product Marketing Manager", "url": "https://recrutement.solocal.com/offer/12528-SkpFIC0gQUxUIC0gUHJvZHVjdCBtYXJrZXRpbmcgbWFuYWdlcg", "fit": "Forte", "date": "—", "why": "Pilotage d’offres, analyses de performance et collaboration marketing/produit.", "risk": "Vérifier rythme et calendrier Efrei.", "rank": 4}, {"company": "Lucky Cart", "role": "Product Manager (alternance)", "url": "https://luckycart.recruitee.com/o/product-manager-alternance", "fit": "Forte", "date": "07/11/2026 14:29", "why": "Automatisation et outils data ; expériences Aplus et Comexposium transférables.", "risk": "Product management formel peu démontré ; rythme 2/1 à valider.", "rank": 5}, {"company": "Kodemade", "role": "Growth Marketing – Acquisition B2C", "url": "https://www.hellowork.com/fr-fr/emplois/84923725.html", "fit": "Incertaine", "date": "—", "why": "Campagnes, leads et KPI : lien avec le marketing de performance.", "risk": "Meta/Google Ads et acquisition opérationnelle à démontrer.", "rank": 6}, {"company": "Paris Society / Accor", "role": "Projets Digitaux & Performance", "url": "https://careers.accor.com/fr/fr/job/alternance-charge-e-de-projets-digitaux-et-performance-in-paris-society-paris-france-jid-115269", "fit": "Excellente", "date": "08/11/2026 10:28", "why": "CRM, segmentation, conversion et expérience événementielle ; cohérence forte.", "risk": "Début janvier 2027, Bac+3 et rythme Efrei à confirmer.", "rank": 7}]};let active='current';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('nc').textContent=DATA.current.length;document.getElementById('ns').textContent=DATA.sent.length;
function render(){document.getElementById('rows').innerHTML=DATA[active].map(x=>`<tr><td class="rank">${x.rank}</td><td><div class="company">${esc(x.company)}</div><div class="role">${esc(x.role)}</div><div class="urlrow"><code class="url" title="${esc(x.url)}">${esc(x.url)}</code><button class="copy" aria-label="Copier le lien de ${esc(x.company)}" onclick="copyUrl('${active}',${x.rank-1},this)">Copier</button><a class="go" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" title="Ouvrir l’offre">↗</a></div></td><td class="fit ${x.fit==='Modérée'?'medium':''}">${esc(x.fit)}</td><td>${esc(x.why)}</td><td>${esc(x.risk)}</td></tr>`).join('');}
async function copyUrl(group,index,button){const s=DATA[group][index].url;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s)}else{const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove()}button.textContent='✓';setTimeout(()=>button.textContent='Copier',1600)}catch(e){window.prompt('Copier le lien :',s)}}
function show(tab){active=tab;document.getElementById('tc').classList.toggle('active',tab==='current');document.getElementById('ts').classList.toggle('active',tab==='sent');render()}render();
</script></body></html>
